buildscript {
  ext.RnHealthConnect = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 26,
    compileSdkVersion: 36,
    compileSdkExtension: 19
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return RnHealthConnect[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${RnHealthConnect.kotlinVersion}"
    // noinspection DifferentKotlinGradleVersion
  }
}


apply plugin: "com.android.library"
if (extensions.findByName("kotlin") == null) {
  apply plugin: "org.jetbrains.kotlin.android"
}

apply plugin: "com.facebook.react"

android {
  namespace "com.rnhealthconnect"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  compileSdkExtension getExtOrDefault("compileSdkExtension")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
  implementation "androidx.health.connect:connect-client:1.2.0-alpha03"
}
